[package]
name = "fpv-desktop"
version = "1.0.0"
description = "FPV desktop — interactive AI narrative engine"
authors = ["Lumizone <lukasz.b@lumizone.pl>"]
edition = "2021"
# 1.84 for `Ipv6Addr::is_unique_local` / `is_unicast_link_local`, used by
# the SSRF guard in `image::validate_public_image_url`. This said 1.77
# and clippy flagged it (`incompatible_msrv`): the build simply failed
# on any toolchain in 1.77..1.84.
rust-version = "1.88"
# Disable Cargo's autodetect of src/bin/*.rs as bin targets.
autobins = false

[lib]
name = "fpv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.32", features = ["bundled"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
once_cell = "1"
async-trait = "0.1"

# crypto
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
url = "2"
bytes = "1.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

# Job objects: kill the bundled Ollama sidecar when the app dies
# abnormally — see sidecars/job_object.rs. `Win32_System_Threading` is
# not optional here: JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds an
# IO_COUNTERS from that module and windows-sys gates the whole struct
# behind it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[features]
default = []
# No optional features. Two inherited from Local Waifu were removed here
# because neither did anything in FPV:
#   - `hid` (IOKit helper for precision slap detection) gated four deps for
#     a companion-AI feature that was stripped with the rest of that surface.
#   - `encrypt-db` claimed to flip `db::encryption::encryption_active()`, but
#     FPV has no `db::encryption` module and the feature name appeared in no
#     `#[cfg]` anywhere in the tree. It read as "app.db can be encrypted",
#     which was never true here. Bring it back together with the module if
#     at-rest encryption is actually implemented.

# Main app binary. Tauri picks the last [[bin]] as "main app" and
# tries to bundle every other one — `required-features` is ignored
# at bundle time, so adding a feature-gated bin here breaks `tauri
# build` even when the feature is off.
[[bin]]
name = "fpv-desktop"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
